[package]
name = "invisibook-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
invisibook-lib = { path = "../lib/chain" }
tokio = { version = "1", features = ["rt-multi-thread"] }
hex = "0.4"
serde_json = "1"
rand = "0.9"
yu-sdk = "0.1.1"
mpc = { path = "../lib/mpc" }
sha2 = "0.10"
num-bigint = "0.4"

[target.'cfg(not(target_os = "android"))'.dependencies]
zk = { path = "../lib/zk" }
