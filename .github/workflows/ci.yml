name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/docs/**'
      - '**/*.md'

jobs:
  # ────────────────────── Detect changed paths ──────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      chain: ${{ steps.filter.outputs.chain }}
      lib: ${{ steps.filter.outputs.lib }}
      zk: ${{ steps.filter.outputs.zk }}
      mpc: ${{ steps.filter.outputs.mpc }}
      cozk: ${{ steps.filter.outputs.cozk }}
      cozk2p: ${{ steps.filter.outputs.cozk2p }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            chain:
              - 'chain/**'
            lib:
              - 'lib/chain/**'
            zk:
              - 'lib/zk/**'
            mpc:
              - 'lib/mpc/**'
            cozk:
              - 'lib/cozk/**'
            cozk2p:
              - 'cozk2p/**'
            app:
              - 'app/**'
              - 'lib/chain/**'

  # ────────────────────── Go: chain ──────────────────────
  chain:
    name: Chain (Go)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.chain == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: chain/go.mod

      - name: Install dependencies
        working-directory: chain
        run: go mod download

      - name: Build chain
        working-directory: chain
        run: go build .

      - name: Vet
        working-directory: chain
        run: go vet .

  # ────────────────────── Rust: lib (chain + mpc) ──────────────────────
  lib:
    name: Lib (Rust)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.lib == 'true' || needs.changes.outputs.mpc == 'true' || needs.changes.outputs.zk == 'true' || needs.changes.outputs.cozk == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            lib/target
          key: ${{ runner.os }}-cargo-lib-${{ hashFiles('lib/Cargo.lock') }}

      - name: Build lib
        working-directory: lib
        run: cargo build

      - name: Test lib (exclude zk + cozk)
        working-directory: lib
        run: cargo test --workspace --exclude zk --exclude cozk

      # ZK/co-zk tests only when lib/zk/** or lib/cozk/** changed — they need
      # the circom/snarkjs/rapidsnark toolchain installed below.
      - name: Cache circuit build (ptau + zkey)
        if: needs.changes.outputs.zk == 'true' || needs.changes.outputs.cozk == 'true'
        uses: actions/cache@v4
        with:
          path: lib/target/circuit-build
          key: ${{ runner.os }}-circuit-build-${{ hashFiles('lib/zk/templates/**/*.circom') }}

      - name: Set up Node.js
        if: needs.changes.outputs.zk == 'true' || needs.changes.outputs.cozk == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install circom
        if: needs.changes.outputs.zk == 'true' || needs.changes.outputs.cozk == 'true'
        run: |
          rustup toolchain install stable
          git clone https://github.com/iden3/circom.git /tmp/circom
          cd /tmp/circom
          cargo +stable build --release
          sudo cp target/release/circom /usr/local/bin/

      - name: Install snarkjs
        if: needs.changes.outputs.zk == 'true' || needs.changes.outputs.cozk == 'true'
        run: npm install -g snarkjs

      - name: Install rapidsnark
        if: needs.changes.outputs.zk == 'true' || needs.changes.outputs.cozk == 'true'
        run: |
          sudo apt-get install -y nasm libsodium-dev
          git clone https://github.com/iden3/rapidsnark.git /tmp/rapidsnark
          cd /tmp/rapidsnark
          git submodule update --init --recursive
          ./build_gmp.sh host
          make host -j$(nproc)
          sudo cp /tmp/rapidsnark/package/bin/prover /usr/local/bin/rapidsnark

      - name: Test lib/zk
        if: needs.changes.outputs.zk == 'true'
        working-directory: lib
        run: cargo test -p zk

      - name: Test lib/cozk (collaborative proving)
        if: needs.changes.outputs.zk == 'true' || needs.changes.outputs.cozk == 'true'
        working-directory: lib
        run: cargo test -p cozk

  # ────────────────────── Rust: app (desktop) ──────────────────────
  app-desktop:
    name: App Desktop (Rust)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            lld

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: ${{ runner.os }}-cargo-app-${{ hashFiles('app/Cargo.lock') }}

      - name: Build desktop app
        working-directory: app/desktop
        run: cargo build

  # ────────────────────── Rust: cozk2p (2-party collaborative ZK) ──────────────────────
  # Separate workspace with its own pinned toolchain (see cozk2p/rust-toolchain.toml);
  # rustup resolves the pin automatically from the working directory.
  cozk2p:
    name: CoZk2p (Rust, 2-party)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.cozk2p == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Rust toolchain
        working-directory: cozk2p
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cozk2p/target
          key: ${{ runner.os }}-cargo-cozk2p-${{ hashFiles('cozk2p/Cargo.lock') }}

      - name: Build
        working-directory: cozk2p
        run: cargo build --release --bins

      # Release mode: the mock-MPC e2e proving test is impractically slow in
      # debug (SPDZ share ops + 16k-domain MSMs).
      - name: Test
        working-directory: cozk2p
        run: cargo test --release
