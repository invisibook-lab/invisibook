name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/docs/**'
      - '**/README.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/docs/**'
      - '**/README.md'

jobs:
  # ────────────────────── Go: chain ──────────────────────
  chain:
    name: Chain (Go)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: chain/go.mod

      - name: Install dependencies
        working-directory: chain
        run: go mod download

      - name: Build chain
        working-directory: chain
        run: go build .

      - name: Vet
        working-directory: chain
        run: go vet .

  # ────────────────────── Rust: lib ──────────────────────
  lib:
    name: Lib (Rust)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            lib/target
          key: ${{ runner.os }}-cargo-lib-${{ hashFiles('lib/Cargo.lock') }}

      - name: Cache circuit build (ptau + zkey)
        uses: actions/cache@v4
        with:
          path: lib/target/circuit-build
          key: ${{ runner.os }}-circuit-build-${{ hashFiles('lib/zk/templates/**/*.circom') }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install circom
        run: |
          rustup toolchain install stable
          git clone https://github.com/iden3/circom.git /tmp/circom
          cd /tmp/circom
          cargo +stable build --release
          sudo cp target/release/circom /usr/local/bin/

      - name: Install snarkjs
        run: npm install -g snarkjs

      - name: Install rapidsnark
        run: |
          sudo apt-get install -y nasm libsodium-dev
          git clone https://github.com/iden3/rapidsnark.git /tmp/rapidsnark
          cd /tmp/rapidsnark
          git submodule update --init --recursive
          ./build_gmp.sh host
          make host -j$(nproc)
          sudo cp /tmp/rapidsnark/package/bin/prover /usr/local/bin/rapidsnark

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            zk:
              - 'lib/zk/**'

      - name: Build lib
        working-directory: lib
        run: cargo build

      - name: Test lib (exclude zk)
        working-directory: lib
        run: cargo test --workspace --exclude zk

      - name: Test lib/zk
        if: steps.filter.outputs.zk == 'true'
        working-directory: lib
        run: cargo test -p zk

  # ────────────────────── Rust: cli ──────────────────────
  cli:
    name: CLI (Rust)
    runs-on: ubuntu-latest
    needs: lib

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: ${{ runner.os }}-cargo-cli-${{ hashFiles('cli/Cargo.lock') }}

      - name: Build cli
        working-directory: cli
        run: cargo build

  # ────────────────────── Rust: app (desktop) ──────────────────────
  app-desktop:
    name: App Desktop (Rust)
    runs-on: ubuntu-latest
    needs: lib

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            lld

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: ${{ runner.os }}-cargo-app-${{ hashFiles('app/Cargo.lock') }}

      - name: Build desktop app
        working-directory: app/desktop
        run: cargo build
