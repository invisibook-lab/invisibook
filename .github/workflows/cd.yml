name: CD

on:
  push:
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ────────────────────── Go: chain (cross-compile all targets) ──────────────────────
  build-chain:
    name: Chain (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            artifact: invisibook-chain-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact: invisibook-chain-darwin-arm64
          - goos: windows
            goarch: amd64
            artifact: invisibook-chain-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: chain/go.mod

      - name: Build chain
        working-directory: chain
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o ${{ matrix.artifact }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: chain/${{ matrix.artifact }}

  # ────────────────────── Rust: desktop (macOS) ──────────────────────
  build-desktop-macos:
    name: Desktop (macOS ${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact: invisibook-desktop-darwin-arm64
          - target: x86_64-apple-darwin
            artifact: invisibook-desktop-darwin-amd64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-desktop-${{ hashFiles('app/Cargo.lock') }}

      - name: Build desktop
        working-directory: app/desktop
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: cp app/target/${{ matrix.target }}/release/invisibook-desktop ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # ────────────────────── Rust: desktop (Windows) ──────────────────────
  build-desktop-windows:
    name: Desktop (Windows x86_64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('app/Cargo.lock') }}

      - name: Build desktop
        working-directory: app/desktop
        run: cargo build --release

      - name: Rename binary
        run: Copy-Item app\target\release\invisibook-desktop.exe invisibook-desktop-windows-amd64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: invisibook-desktop-windows-amd64.exe
          path: invisibook-desktop-windows-amd64.exe

  # ────────────────────── Release ──────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-chain, build-desktop-macos, build-desktop-windows]

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lR artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*
