# Core Tripod Configuration

# One SQLite database for all tripods: orders and cash are the same
# block's state, so they share a file and a transaction.
db_path      = "data/chain.db"
db_log_level = "warn"   # "silent" | "error" | "warn" | "info"

[consensus]
min_payment     = "100"
# Protocol behaviour is to sit out any height with no L1-confirmed declaration.
# Turn this on together with [ckb] below: against the mock L1 no declaration
# can ever be confirmed, so a lone node would never produce a block.
require_declared_payment = false
# Block reward: a fixed coinbase plus the handling fees the block collected,
# paid to the producer's own miner key. Set to "0" to run without an
# incentive layer.
coinbase_reward = "1000"
block_interval  = 3000   # milliseconds between blocks
pack_num        = 30000  # max transactions per block
payment_listen        = ":8081"
# Seed the miner keypair is derived from. `cmd/pob-miner` reads it from here
# so that the budget cell it creates on CKB is owned by the very key this node
# produces blocks with — V7 compares the two.
miner_secret          = "node1"
l1_poll_interval      = 1000   # ms, how often to ask L1 whether a commitment landed

[orderbook]
# Verification keys for the OrderBook tripod's circuits. Split is for
# SendOrder's split branch; settle_larger is the settle circuit for the
# larger side (change + cross-leg ratio check). The smaller party confirms
# settlement without ZK proof, so no settle_smaller VK is needed.
# settle_cozk is the joint settlement circuit whose single Groth16 proof is
# generated collaboratively by both traders (SettleOrdersCoZk writing).
# settle_cozk2p is the 2-party PLONK variant (SettleOrdersCoZk2p writing);
# its verification additionally needs a chain built with `-tags cozk2p`.
split_vk_path         = "vk/split_vk.json"
settle_larger_vk_path = "vk/settle_larger_vk.json"
settle_cozk_vk_path   = "vk/settle_cozk_vk.json"
settle_cozk2p_vk_path = "vk/settle_cozk2p_vk.bin"

[account]
# Deposit / Withdraw verification keys — produced by `snarkjs zkey export verificationkey`
# (or by re-running the corresponding `dev_setup_snarkjs` test). Paths are
# relative to wherever you launch the chain from.
deposit_vk_path  = "vk/deposit_vk.json"
withdraw_vk_path = "vk/withdraw_vk.json"

# Genesis cash: explicit Cash records inserted at chain startup.
