# Core Tripod Configuration

# Enters every bind transcript (cross-chain replay protection); must equal
# the yu kernel's chain id in chain.toml.
chain_id = 1926

[orderbook]
db_path      = "data/orders.db"
db_log_level = "warn"   # "silent" | "error" | "warn" | "info"
# Refuse to boot when any VK below is missing (the secure default; set to
# false ONLY for dev/test configs that run without circuit artifacts).
require_proofs = true
# Verification keys for the OrderBook tripod's circuits.
# settle_cozk is the joint settlement circuit whose single Groth16 proof is
# generated collaboratively by both traders (SubmitCompareCoZk writing).
# settle_cozk2p is the 2-party PLONK variant (SubmitCompareCoZk2p writing);
# its verification additionally needs a chain built with `-tags cozk2p`.
# settle_pair_cozk2p is the MERGED statement (SettlePairCoZk2p writing):
# one collaborative PLONK proof for compare + both settle legs.
settle_cozk_vk_path        = "vk/settle_cozk_vk.json"
settle_small_vk_path       = "vk/settle_small_vk.json"
settle_large_vk_path       = "vk/settle_large_vk.json"
send_order_vk_path         = "vk/send_order_vk.json"
claim_fees_vk_path         = "vk/claim_fees_vk.json"
settle_cozk2p_vk_path      = "vk/settle_cozk2p_vk.bin"
settle_pair_cozk2p_vk_path = "vk/settle_pair_cozk2p_vk.bin"

[account]
db_path      = "data/accounts.db"
db_log_level = "warn"   # "silent" | "error" | "warn" | "info"
require_proofs = true
# Shielded-pool circuits (note model).
note_deposit_vk_path   = "vk/note_deposit_vk.json"
spend_withdraw_vk_path = "vk/spend_withdraw_vk.json"
# Bridge operator ed25519 pubkey (64-char hex). Interim NoteDeposit gate
# until the real bridge inclusion proof lands: when set, deposits must be
# operator-signed; when empty the check is SKIPPED — dev only, a public
# network must set it.
bridge_operator_pubkey = ""

# Genesis pool notes: shielded leaves seeded at chain startup (listing
# order = leaf indices 0..n-1). Regenerate with
# `cargo run -p invisibook-lib --example dump_dev_notes` — the fixed dev
# secrets live in that example and in cfg/tests/{alice,bob}_notes.json.
# alice mnemonic: "test test test test test test test test test test test junk"
# bob mnemonic:   "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"

