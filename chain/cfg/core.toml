# ── L1 ──────────────────────────────────────────────────────────────────────
# Where CKB is, and which scripts this chain's cells are guarded by. With the
# section absent or disabled the node runs against an in-memory mock L1:
# payments are not real and blocks are not anchored, which is fine for
# development and is not the protocol.
#
# There are no useful defaults below. The four PoB scripts are deployed per
# chain, so `cmd/ckb-deploy` publishes them and prints this whole section:
#
#   go run ./cmd/ckb-deploy -rpc http://127.0.0.1:8114 -network devnet \
#     -sighash-dep 0x<devnet genesis tx> -mining-addr ckt1... \
#     -key-file ./devnet-miner.key >> cfg/core.toml
#
# Every `args` among those scripts is derived by the node from `mining_addr`,
# because they are parameterised by each other: pob-spent by the mining addr,
# pob-vault by the resulting spent script hash, pob-budget by both plus the
# sighash code hash. That is why none of them appears here.
#
# [ckb]
# enabled  = true
# rpc_url  = "http://127.0.0.1:8114"
# network  = "devnet"                  # mainnet | testnet | devnet
# # Required on a devnet only: the standard lock lives in that chain's own
# # genesis transaction, so there is no constant to fall back on.
# sighash_dep_tx_hash = "0x..."
# # The address every miner's prepayment is paid into. Chosen once and never
# # changeable: pob-spent carries its lock hash in args, and a different args
# # is a different mark that cannot govern the old address (ckb_layout.md §4).
# mining_addr = "ckt1..."
# fee_rate = 1000                      # shannon per 1000 bytes
#
# [ckb.budget_script]                  # pob-budget
# code_hash   = "0x..."
# hash_type   = "data1"
# dep_tx_hash = "0x..."
# dep_index   = 0
# dep_type    = "code"
#
# [ckb.commit_script]                  # pob-submission
# ...
# [ckb.vault_script]                   # pob-vault
# ...
# [ckb.spent_script]                   # pob-spent
# ...
