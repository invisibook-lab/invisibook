[package]
name = "budget-stark"
version = "0.1.0"
edition = "2024"

# no_std by default: the verifier half is linked into the `pob-budget` CKB
# script (riscv64imac, no OS). The `prover` feature adds proving, which needs
# an entropy source and so only builds on a host.

[features]
default = []
prover = ["rand/sys_rng"]

[dependencies]
p3-air = "=0.8.0"
p3-challenger = "=0.8.0"
p3-commit = "=0.8.0"
p3-dft = "=0.8.0"
p3-field = "=0.8.0"
p3-fri = "=0.8.0"
p3-keccak = "=0.8.0"
p3-koala-bear = "=0.8.0"
p3-matrix = "=0.8.0"
p3-merkle-tree = "=0.8.0"
p3-poseidon2 = "=0.8.0"
p3-poseidon2-air = "=0.8.0"
p3-symmetric = "=0.8.0"
p3-uni-stark = "=0.8.0"
postcard = { version = "1", default-features = false, features = ["alloc"] }
rand = { version = "0.10.1", default-features = false, features = ["std_rng"] }
# Compiles every tracing macro in Plonky3 out. Its callsite registration uses
# atomics, which CKB-VM does not execute.
tracing = { version = "0.1", default-features = false, features = ["max_level_off", "release_max_level_off"] }

[dev-dependencies]
budget-stark = { path = ".", features = ["prover"] }
