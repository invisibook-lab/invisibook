[package]
name = "cozk"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
ark-bn254 = "0.5"
ark-groth16 = "0.5"
ark-serialize = "0.5"
bytes = "1"
clap = { version = "4", features = ["derive"] }
# Collaborative proving stack — our fork of TaceoLabs/co-snarks, pinned.
co-circom = { git = "https://github.com/invisibook-lab/co-snarks", rev = "36da0ea855fc630db632a296e201b310540c5f20" }
co-circom-types = { git = "https://github.com/invisibook-lab/co-snarks", rev = "36da0ea855fc630db632a296e201b310540c5f20" }
mpc-net = { git = "https://github.com/invisibook-lab/co-snarks", rev = "36da0ea855fc630db632a296e201b310540c5f20", features = ["local", "tcp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zk = { path = "../zk" }
