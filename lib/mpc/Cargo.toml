[package]
name = "mpc"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ark-mpc = { version = "0.1", features = ["ark-bn254", "test_helpers"] }
ark-bn254 = "0.4"
ark-ec = "0.4"
ark-ff = "0.4"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
light-poseidon = "0.2"
tokio = { version = "1", features = ["full", "test-util"] }
