[package]
name = "invisibook-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
dirs = "6"
dioxus = { version = "0.7", features = ["desktop"] }
invisibook-ui = { path = "../ui" }
invisibook-lib = { path = "../../lib/chain" }
tokio = { version = "1", features = ["rt", "macros"] }
futures-util = "0.3"
hex = "0.4"
sha2 = "0.10"
num-bigint = "0.4"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
curve25519-dalek = "4"
rand = "0.9"
