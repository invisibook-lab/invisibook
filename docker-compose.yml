services:
  chain:
    build:
      # Repo-root context: the image links the cozk2p Rust staticlib into
      # the chain binary (see chain/Dockerfile).
      context: .
      dockerfile: chain/Dockerfile
    ports:
      - "7999:7999"
      - "8999:8999"
      - "8887:8887"
    volumes:
      - ~/.invisibook/chain/data:/app/data
    restart: unless-stopped
